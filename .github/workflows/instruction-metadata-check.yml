---
on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/check_instruction_metadata.py
      - toolkits/**/*.instructions.md
      - .github/workflows/instruction-metadata-check.yml
  push:
    branches:
      - main
    paths:
      - scripts/check_instruction_metadata.py
      - toolkits/**/*.instructions.md
      - .github/workflows/instruction-metadata-check.yml

permissions:
  contents: read

jobs:
  instruction-metadata:
    name: Instruction metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check toolkit instruction metadata
        run: python3 scripts/check_instruction_metadata.py