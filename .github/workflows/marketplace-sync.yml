---
name: Marketplace Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - apm.yml
      - .claude-plugin/marketplace.json
      - scripts/check_marketplace_sync.py
      - toolkits/**
  push:
    branches:
      - main
    paths:
      - apm.yml
      - .claude-plugin/marketplace.json
      - scripts/check_marketplace_sync.py
      - toolkits/**

permissions:
  contents: read

jobs:
  marketplace-sync:
    name: Marketplace sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check marketplace is in sync
        run: python3 scripts/check_marketplace_sync.py
