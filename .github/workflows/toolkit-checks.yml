---
name: "Toolkit and Marketplace Checks"

on:
  pull_request:
    paths: &toolkit_check_paths
      - apm.yml
      - apm.lock.yaml
      - .github/instructions/**
      - .vscode/mcp.json
      - .claude-plugin/marketplace.json
      - scripts/check_instruction_metadata.py
      - scripts/check_marketplace_sync.py
      - scripts/check_toolkit_version_bump.py
      - scripts/test_marketplace_sync.py
      - toolkits/**
      - .github/workflows/toolkit-checks.yml
  push:
    branches:
      - main
    paths: *toolkit_check_paths

permissions:
  contents: read

jobs:
  apm-audit:
    name: APM integrity audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up APM
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: "latest"
          # Do not overwrite committed deployments before checking for drift.
          setup-only: true

      - name: Audit committed APM files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apm audit --ci

  toolkit-version:
    name: Toolkit version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check changed toolkit versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_toolkit_version_bump.py "$BASE_SHA" "$HEAD_SHA"

  instruction-metadata:
    name: Instruction metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check toolkit instruction metadata
        run: python3 scripts/check_instruction_metadata.py

  marketplace-sync:
    name: Marketplace sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test marketplace sync check
        run: python3 -m unittest discover -s scripts -p 'test_marketplace_sync.py'

      - name: Check marketplace is in sync
        run: python3 scripts/check_marketplace_sync.py
